[project]
name = "xcap"
version = "0.1.0"
description = "One-shot archival extraction of EODHD financial data into analysis-ready parquet."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=16",
    "duckdb>=1.0",
    "zstandard>=0.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
